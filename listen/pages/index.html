<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Listen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Listen</h1>
      <input id="filter" type="search" placeholder="Filter" aria-label="Filter clips">
    </header>
    <section id="player" hidden>
      <p id="now"></p>
      <audio id="audio" controls></audio>
      <label>Speed
        <select id="speed">
          <option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option>
        </select>
      </label>
    </section>
    <ul id="pending"></ul>
    <ul id="clips"><li class="muted">Loading…</li></ul>
  </main>
  <script src="library.js"></script>
</body>
</html>
