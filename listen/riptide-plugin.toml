name = "listen"
description = "Hear the page's article read aloud by Piper, or a summary from a local LLM, with its text following along"
riptide = ">=0.20"
# Readability, to find the article.
dependencies = ["reader"]

[permissions]
# Reads the article out of the page you're on.
pages = ["*"]
# Runs curl (to reach Ollama), piper and ffmpeg.
spawn = true
# Reads and deletes the clips it saved, to play them on its page.
files = true

[[option]]
name = "key"
description = "The key that reads the page aloud"
default = "gA"

[[option]]
name = "read"
type = "choice"
choices = ["article", "summary"]
default = "article"
description = "What the key reads: the article itself, or a summary from Ollama (:listen article or :listen summary picks for one page)"

[[option]]
name = "voice"
type = "path"
description = "A Piper voice's .onnx file (default: the one downloaded on :listen-library)"

[[option]]
name = "model"
description = "The Ollama model that writes summaries"
default = "llama3.2"

[[option]]
name = "ollama"
description = "Where Ollama listens"
default = "http://localhost:11434"

[[option]]
name = "words"
type = "number"
description = "About how long a summary is, in words"
default = 150

[[option]]
name = "piper"
type = "path"
description = "The piper program, if it isn't on your PATH"

[[option]]
name = "ffmpeg"
type = "path"
description = "The ffmpeg program, if it isn't on your PATH; without it, clips stay as larger WAV files"

[[option]]
name = "dir"
type = "path"
description = "Where clips are saved (default: riptide/listen in your data folder)"
