name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install riptide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libgbm1 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libpango-1.0-0 libcairo2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libxi6 libdrm2 libdbus-1-3
          # The nightly build: --plugin-test is newer than the latest release.
          gh release download nightly -R joshzcold/riptide -p '*-linux-x86_64.tar.gz' -O riptide.tar.gz
          mkdir riptide && tar -xzf riptide.tar.gz -C riptide --strip-components=1
          echo "$PWD/riptide" >> "$GITHUB_PATH"
      - name: Install nvim
        run: |
          # For firenvim's tests.
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.11.3/nvim-linux-x86_64.tar.gz | tar -xz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          # Its first start is slow; the specs have 10 s each.
          ./nvim-linux-x86_64/bin/nvim --headless --clean +qa
      - name: Test every plugin with tests
        run: |
          status=0
          have=$(riptide --version | awk '{print $2}')
          for dir in */; do
            [ -d "$dir/test" ] || continue
            echo "== ${dir%/}"
            # A plugin for the next release waits until the nightly is that
            # version; an older riptide may not even read its manifest.
            need=$(sed -n 's/^riptide *= *">= *\([0-9.]*\)".*/\1/p' "$dir/riptide-plugin.toml")
            if [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
              echo "::warning::${dir%/} skipped: needs riptide >=$need, and this is $have"
              continue
            fi
            if ! xvfb-run -a riptide --plugin-test "$dir"; then
              # A slow runner can take a browser test past its 10 s; a real
              # failure fails again.
              echo "== ${dir%/}, again"
              if xvfb-run -a riptide --plugin-test "$dir"; then
                echo "::warning::${dir%/} passed on the second try"
              else
                status=1
              fi
            fi
          done
          exit $status
